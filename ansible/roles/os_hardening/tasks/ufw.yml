---
# ── Règle de sécurité : s'assurer que la clé SSH est bien en place AVANT
# d'activer UFW sinon risque de se couper du serveur.
- name: Verify authorized_keys exists for ansible user
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.ssh/authorized_keys"
  register: os_hardening_authorized_keys

- name: Abort if no authorized_keys found (would lock out)
  ansible.builtin.fail:
    msg: >
      SÉCURITÉ : authorized_keys introuvable pour {{ ansible_user }}.
      Ajouter la clé SSH avant d'activer UFW pour éviter un lockout.
  when: not os_hardening_authorized_keys.stat.exists

# ── Politique par défaut ────────────────────────────────────────────────────
- name: Set UFW default policy — deny incoming, allow outgoing
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }

# ── SSH depuis admin CIDR uniquement ────────────────────────────────────────
- name: Allow SSH from admin CIDR only
  community.general.ufw:
    rule: allow
    port: "{{ os_hardening_ssh_port }}"
    proto: tcp
    src: "{{ os_hardening_admin_cidr }}"
    comment: "SSH admin access"
  when: os_hardening_admin_cidr != ''

- name: Fail if no admin CIDR defined (would expose SSH to Internet)
  ansible.builtin.fail:
    msg: >-
      SÉCURITÉ : os_hardening_admin_cidr est requis pour restreindre l'accès SSH.
      Relancer avec -e admin_cidr=X.X.X.X/32.
      Ouvrir SSH à 0.0.0.0/0 est interdit par cette politique de sécurité.
  when: os_hardening_admin_cidr == ''

# ── HTTP / HTTPS ─────────────────────────────────────────────────────────────
- name: Allow HTTP/HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment }}"
  loop: "{{ os_hardening_ufw_allowed_ports }}"

# ── Ports K3s (API Server + kubelet) ─────────────────────────────────────────
- name: Allow K3s ports from admin CIDR
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    src: "{{ os_hardening_admin_cidr }}"
    comment: "{{ item.comment }}"
  loop: "{{ os_hardening_k3s_ports }}"
  when: os_hardening_admin_cidr != ''

# ── Réseaux internes K3s/Flannel ─────────────────────────────────────────────
- name: Allow K3s internal pod/service networks (Flannel CNI)
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
    comment: "K3s internal network (Flannel)"
  loop: "{{ os_hardening_k3s_internal_cidrs }}"

# ── Activation ────────────────────────────────────────────────────────────────
- name: Enable UFW
  community.general.ufw:
    state: enabled
    logging: "on"

- name: Show UFW status
  ansible.builtin.command: ufw status verbose
  register: os_hardening_ufw_status
  changed_when: false

- name: Display UFW status
  ansible.builtin.debug:
    var: os_hardening_ufw_status.stdout_lines
