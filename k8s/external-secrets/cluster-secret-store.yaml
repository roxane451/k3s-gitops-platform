# k8s/external-secrets/cluster-secret-store.yaml
#
# ClusterSecretStore — Infisical comme backend de secrets
#
# Authentification : Universal Auth (Machine Identity)
#   Méthode recommandée par Infisical depuis 2024 (Service Token = legacy)
#
# Machine Identities (credentials dans le Secret infisical-token de chaque namespace) :
#   - app-eso-prod       → namespace app
#   - app-eso-preprod    → namespace app-preprod
#
# Projet Infisical :
#   - Project: app
#   - Project Slug: <INFISICAL_PROJECT_SLUG> (à remplacer par le slug du projet)
#   - Environments: prod, preprod
#
# Architecture des stores :
#
#   PROD
#   ├── infisical-store-backend     → env: prod  → secretsPath: /backend
#   ├── infisical-store-mongodb     → env: prod  → secretsPath: /mongodb
#   └── infisical-store-r2          → env: prod  → secretsPath: /r2
#
#   PREPROD
#   ├── infisical-store-preprod-backend  → env: preprod → secretsPath: /backend
#   ├── infisical-store-preprod-mongodb  → env: preprod → secretsPath: /mongodb
#   └── infisical-store-preprod-r2       → env: preprod → secretsPath: /r2
#
# Bootstrap (UNE FOIS avant le premier déploiement) :
#   ansible-playbook -i inventories/production.yml playbook-k3s.yml --tags infisical
#   (crée les Secrets infisical-token puis applique ce fichier)
#
# Vérification après apply :
#   kubectl get clustersecretstore
#   → READY: True  STATUS: Valid

# ==============================================================================
# PRODUCTION
# ==============================================================================

---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical-store-backend
  annotations:
    infisical.com/host: "https://eu.infisical.com"
    infisical.com/project: "<INFISICAL_PROJECT_SLUG>"
    infisical.com/path: "/backend"
spec:
  provider:
    infisical:
      hostAPI: https://eu.infisical.com/api
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-token
            key: clientId
            namespace: app
          clientSecret:
            name: infisical-token
            key: clientSecret
            namespace: app
      secretsScope:
        projectSlug: <INFISICAL_PROJECT_SLUG>
        environmentSlug: prod
        secretsPath: /backend
        recursive: false

