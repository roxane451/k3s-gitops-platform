# Crée le Secret Kubernetes "alertmanager-slack-secret" à partir d'Infisical
# via l'opérateur External Secrets (même pattern que grafana-secret.yaml).
#
# Ce secret contient la configuration complète d'Alertmanager au format YAML.
# External Secrets récupère SLACK_WEBHOOK_URL depuis Infisical et l'injecte
# directement dans la clé alertmanager.yaml du secret.
#
# On n'utilise PAS de template ESO ici car le moteur Go template d'ESO
#     n'a pas accès aux variables Alertmanager (.GroupLabels, .Status, etc.)
#     → la config Alertmanager est construite côté Infisical via la clé
#       ALERTMANAGER_CONFIG qui contient le YAML complet.
#
# Prérequis :
#   - ClusterSecretStore "infisical-store-backend" opérationnel
#   - Clé ALERTMANAGER_CONFIG créée dans Infisical (env: prod)
#     → voir commentaire plus bas pour la valeur à coller
#
# Vérification :
#   kubectl get externalsecret alertmanager-slack-secret -n monitoring
#   → STATUS: SecretSynced
#   kubectl get secret alertmanager-slack-secret -n monitoring -o yaml
#   → doit contenir la clé alertmanager.yaml

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-store-backend
    kind: ClusterSecretStore
  target:
    name: alertmanager-slack-secret
    creationPolicy: Owner
  data:
    # Alertmanager attend une clé "alertmanager.yaml" dans le secret
    # La valeur complète est stockée dans Infisical sous ALERTMANAGER_CONFIG
    - secretKey: alertmanager.yaml
      remoteRef:
        key: ALERTMANAGER_CONFIG
