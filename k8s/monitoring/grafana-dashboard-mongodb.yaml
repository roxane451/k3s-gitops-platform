apiVersion: v1
data:
  app-mongodb.json: |
    {
      "id": null,
      "uid": "app-mongodb",
      "title": "App / MongoDB",
      "description": "Dashboard MongoDB (namespace: app) via mongodb-exporter, port 9216. À adapter si les noms de métriques diffèrent selon la version de l'exporter (vérifier dans Prometheus > Explore).",
      "tags": ["app", "mongodb", "custom"],
      "timezone": "Europe/Paris",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "hide": 0,
            "current": {}
          },
          {
            "name": "namespace",
            "type": "constant",
            "query": "app",
            "current": { "value": "app", "text": "app" },
            "hide": 2
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "MongoDB Up",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "targets": [
            { "expr": "max by (pod) (up{namespace=\"$namespace\", job=\"mongodb-metrics\"})", "legendFormat": "{{pod}}" }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" } } },
                { "type": "value", "options": { "1": { "text": "UP", "color": "green" } } }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          },
          "options": { "textMode": "value_and_name", "colorMode": "background" }
        },
        {
          "id": 2,
          "title": "Connexions actives",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "targets": [
            { "expr": "max(mongodb_connections{namespace=\"$namespace\", state=\"current\"})", "legendFormat": "connexions" }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 80 },
                  { "color": "red", "value": 100 }
                ]
              }
            }
          },
          "options": { "colorMode": "background" }
        },
        {
          "id": 3,
          "title": "Ops / sec (total)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "targets": [
            { "expr": "sum(rate(mongodb_op_counters_total{namespace=\"$namespace\"}[5m]))", "legendFormat": "ops/s" }
          ],
          "fieldConfig": { "defaults": { "unit": "ops" } }
        },
        {
          "id": 4,
          "title": "Mémoire résidente",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "targets": [
            { "expr": "max(mongodb_memory{namespace=\"$namespace\", type=\"resident\"}) * 1024 * 1024", "legendFormat": "resident" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 838860800 },
                  { "color": "red", "value": 1073741824 }
                ]
              }
            }
          },
          "options": { "colorMode": "background" }
        },
        {
          "id": 5,
          "title": "Réseau (bytes/s in+out)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "targets": [
            { "expr": "sum(rate(mongodb_network_bytes_total{namespace=\"$namespace\"}[5m])) or vector(0)", "legendFormat": "réseau" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 5242880 },
                  { "color": "red", "value": 20971520 }
                ]
              }
            }
          },
          "options": { "colorMode": "background" }
        },
        {
          "id": 6,
          "title": "Taille des données (dbstats)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "targets": [
            { "expr": "sum(mongodb_dbstats_dataSize{namespace=\"$namespace\"})", "legendFormat": "dataSize" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 524288000 },
                  { "color": "red", "value": 1073741824 }
                ]
              }
            }
          },
          "options": { "colorMode": "background" }
        },
        {
          "id": 10,
          "title": "Connexions (current / available)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "targets": [
            { "expr": "max(mongodb_connections{namespace=\"$namespace\", state=\"current\"})", "legendFormat": "current" },
            { "expr": "max(mongodb_connections{namespace=\"$namespace\", state=\"available\"})", "legendFormat": "available" }
          ]
        },
        {
          "id": 11,
          "title": "Opérations par type (insert/query/update/delete)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "targets": [
            { "expr": "sum by (type) (rate(mongodb_op_counters_total{namespace=\"$namespace\"}[5m]))", "legendFormat": "{{type}}" }
          ],
          "fieldConfig": { "defaults": { "unit": "ops", "custom": { "fillOpacity": 10 } } }
        },
        {
          "id": 12,
          "title": "Mémoire (resident / virtual / mapped)",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "targets": [
            { "expr": "max(mongodb_memory{namespace=\"$namespace\", type=\"resident\"}) * 1024 * 1024", "legendFormat": "resident" },
            { "expr": "max(mongodb_memory{namespace=\"$namespace\", type=\"virtual\"}) * 1024 * 1024", "legendFormat": "virtual" }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "id": 13,
          "title": "CPU / mémoire du pod MongoDB",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "targets": [
            { "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"$namespace\", pod=~\"mongodb.*\", container!=\"\"}[5m]))", "legendFormat": "CPU {{pod}}" },
            { "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"$namespace\", pod=~\"mongodb.*\", container!=\"\"}) / 1e9", "legendFormat": "RAM(GB) {{pod}}" }
          ]
        },
        {
          "id": 14,
          "title": "CPU Throttling MongoDB",
          "description": "Part des périodes CFS où le conteneur a été throttlé, faute de CPU suffisant vs sa limite. Ajouté suite à l'incident CPUThrottlingHigh (juillet 2026) — cible: proche de 0%.",
          "type": "stat",
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 19 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_cfs_throttled_periods_total{namespace=\"$namespace\", container=\"mongodb\"}[5m])) / sum(rate(container_cpu_cfs_periods_total{namespace=\"$namespace\", container=\"mongodb\"}[5m])) or on() vector(0)",
              "legendFormat": "throttling"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 0.1 },
                  { "color": "red", "value": 0.3 }
                ]
              }
            }
          },
          "options": { "colorMode": "value", "graphMode": "area", "textMode": "value" }
        }
      ]
    }
kind: ConfigMap
metadata:
  name: grafana-dashboard-app-mongodb
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Application
