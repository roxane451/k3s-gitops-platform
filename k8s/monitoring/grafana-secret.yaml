# Crée le Secret K8s "grafana-admin-secret" à partir d'Infisical
# via l'opérateur External Secrets (installé au niveau infra).
#
# Prérequis :
#   - ClusterSecretStore "infisical-store-backend" opérationnel
#   - Clé GRAFANA_ADMIN_PASSWORD créée dans Infisical (env: prod)
#
# Vérification :
#   kubectl get externalsecret grafana-admin-secret -n monitoring
#   → STATUS: SecretSynced
#   kubectl get secret grafana-admin-secret -n monitoring
#   → doit exister avec la clé admin-password
#
# IMPORTANT : appliquer ce fichier AVANT application-prometheus.yaml
# sinon Grafana démarre sans trouver le Secret et crashe.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-store-backend
    kind: ClusterSecretStore
  target:
    name: grafana-admin-secret
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: GRAFANA_ADMIN_PASSWORD
    - secretKey: admin-user
      remoteRef:
        key: GRAFANA_ADMIN_USER
